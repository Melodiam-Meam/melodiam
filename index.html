<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#1556b8"><title>Melodiam</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Melodiam">
<style>
:root{--bg:#fdfaf3;--card:#fff;--tx:#0c2147;--mut:#68718c;--blue:#1556b8;--gold:#c59d45;--bd:#e1e5f5;--in:#f6f7fc}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:100px}
main{max-width:640px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 20px}
h1{font-size:2.1rem;line-height:1.1;font-weight:800;letter-spacing:-.025em;margin:6px 0 10px}h2{font-size:1.3rem;margin:22px 0 10px}
.eb{margin:0;font-size:.74rem;font-weight:800;letter-spacing:.22em;color:var(--blue)}.m{color:var(--mut);font-size:.9rem;margin:2px 0}.err{color:#c0443f;min-height:1.4em;margin:4px 0;font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.top img{width:76px;height:76px;border-radius:50%;background:#fff;padding:3px;border:2px solid var(--gold)}
.c{background:var(--card);border:1.5px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:12px}.c.g{border-left:5px solid var(--gold)}
button{font:inherit;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px;font-weight:650}button.o{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}button.ok{background:#1f8f58}button.no{background:#c0443f}.big{width:100%;margin-top:8px}
input,select{font:inherit;width:100%;color:var(--tx);background:var(--in);border:1.5px solid var(--bd);border-radius:14px;padding:11px 13px;margin:4px 0}
.r{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{background:var(--card);color:var(--tx);border:1.5px solid var(--bd)}.tabs button.on{background:var(--blue);color:#fff;border-color:var(--gold)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;border-top:1.5px solid var(--bd);border-radius:26px 26px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px #0c214712}
nav button{flex:1;background:none;color:var(--mut);font-size:.72rem;padding:4px 0;display:flex;flex-direction:column;align-items:center;min-height:54px}nav button b{font-size:1.35rem}nav button.on{color:var(--blue)}
.bd{background:#d93a3a;color:#fff;border-radius:99px;font:700 .68rem/18px sans-serif;min-width:18px;height:18px;padding:0 5px;text-align:center;font-style:normal;margin-left:4px}
.row{width:100%;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;text-align:left}
.msgs{display:flex;flex-direction:column;gap:6px;margin:10px 0;min-height:160px}.b{max-width:82%;padding:9px 13px;border-radius:18px 18px 18px 6px;background:var(--card);border:1.5px solid var(--bd);align-self:flex-start;word-break:break-word}.b.me{align-self:flex-end;background:#dce8ff;border-radius:18px 18px 6px 18px}
.b i{display:block;font-size:.72rem;color:var(--gold);font-style:normal;font-weight:700}.b small{display:block;text-align:right;color:var(--mut);font-size:.7rem}.rd{color:#2f8cff}
.bar{height:8px;border-radius:9px;background:var(--in);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#e6cd8f)}
.part{width:100%;border:1.5px solid var(--bd);border-radius:18px;background:#fff}iframe.part{height:70vh}
#mp{position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom,0px));background:#0c2147;color:#fff;border-radius:18px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:8px;z-index:6;border:1.5px solid var(--gold)}#mp[hidden]{display:none}#mp b{flex:1;font-size:.9rem}#mp button{padding:6px 12px;min-height:36px;color:#fff;border-color:#fff8}
#rd{position:fixed;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column;touch-action:manipulation;overscroll-behavior:none}#rd[hidden]{display:none}
#rb{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;background:#0c2147;color:#fff}#rb b{flex:1;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#rb button{padding:6px 12px;min-height:36px;color:#fff;border-color:#fff8}
#rc{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
</style></head><body><main id="app"></main><div id="rd" hidden><div id="rb"><button class="o" onclick="closeR()">✕ Fermer</button><b id="rt"></b><span id="rn"></span><button onclick="rdPlay()">♫</button></div><div id="rc" onclick="tap(event)"></div></div><div id="mp" hidden><b id="mt"></b><button class="o" onclick="tg()">⏯</button><button class="o" onclick="stopA()">✕</button></div><nav id="nav"></nav><audio id="pl" playsinline></audio>

const sig=l.map(m=>m.id+':'+(m.message_reads||[]).length).join(',');if(el.dataset.s===sig)return;el.dataset.s=sig;
const near=innerHeight+scrollY>=document.body.scrollHeight-160;el.innerHTML=bubbles(l);if(near)scrollTo(0,1e5);updateBadge()}
async function send(){const x=V('mx');if(!x)return;$('#mx').value='';await sb.from('messages').insert({channel:cur,body:x});await refreshChat();scrollTo(0,1e5);const i=$('#mx');if(i)i.focus()}
async function dm(id){await sb.from('messages').delete().eq('id',id);draw()}
let tk=0;
function live(){if(!window.pt){window.pt=setInterval(()=>{if(document.hidden)return;tk++;if(tab=='msg'||tk%4==0)rt()},4000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)rt()})}sb.channel('live').on('postgres_changes',{event:'*',schema:'public',table:'messages'},rt).on('postgres_changes',{event:'*',schema:'public',table:'message_reads'},rt).subscribe()}
async function rt(){if(!me||me.status!='valide')return;if(tab=='msg'){cur?refreshChat():draw()}else updateBadge()}
let fo=null,it=null,AU={},GR={};const FN={},SU={};
const nv=t=>`tab='${t}';fo=null;it=null;cur=null;draw()`,rw=(t,l,d='')=>`<button class="row" onclick="${nv(t)}"><b>${l}</b><span class="m">${d}</span></button>`;
const canEdit=sp=>sp=='bureau'?me.role!='membre':me.role=='cheffe',BK='melodiam';
function plus(){return hd('Plus')+(me.role!='membre'?rw('bu','▤ Espace bureau'):'')+(me.role=='cheffe'?rw('ch','★ Espace cheffe de chœur',window.NP?NP+' demande(s)':''):'')+`<div class="c"><h3>Notifications</h3><p class="m">Une alerte à chaque nouveau message et à chaque nouveau concert.</p><button onclick="pushOn()">Activer les notifications</button><p id="pm" class="m"></p></div>`+`<div class="c g"><b>${esc(me.name)}</b><p class="m">${me.role=='cheffe'?'Cheffe de chœur':esc(me.pupitre)+(me.role=='bureau'?' · bureau':'')}</p><button class="o" onclick="out()">Se déconnecter</button></div>`}
async function folders(sp,title){const ed=canEdit(sp),st=sb.storage.from(BK);
if(!fo){const{data}=await sb.from('folders').select('*').eq('space',sp).order('name');
return hd(title)+(sp=='cheffe'?rw('dem','✓ Demandes d’inscription',window.NP?NP+' en attente':'')+rw('pres','▦ Présences / absences'):'')+((data||[]).map(f=>{FN[f.id]=f.name;return `<button class="row" onclick="fo=${f.id};draw()"><b>📁 ${esc(f.name)}</b></button>`}).join('')||'<div class="c m">Aucun dossier.</div>')+(ed?`<div class="c"><h3>Nouveau dossier</h3><input id="nf" placeholder="Nom du dossier"><button onclick="addFo('${sp}')">Créer</button></div>`:'')}
const{data}=await sb.from('files').select('*').eq('folder_id',fo).order('name'),fl=data||[];
if(fl.length){((await st.createSignedUrls(fl.map(f=>f.path),7200)).data||[]).forEach(x=>SU[x.path]=x.signedUrl)}
GR={};fl.forEach(f=>(GR[f.name]=GR[f.name]||[]).push(f));
if(sp=='repertoire'&&it&&GR[it]){const fs=GR[it],sc=fs.find(f=>f.kind=='partition'),au=fs.find(f=>f.kind=='audio');AU={u:au&&SU[au.path],t:it};
return `<button class="o" onclick="it=null;draw()">← ${esc(FN[fo]||title)}</button><h1>${esc(it)}</h1>`+(sc?(LR={u:SU[sc.path],pdf:/\.pdf$/i.test(sc.path),t:it},OPENR&&(OPENR=0,RD=LR),`<button class="big" onclick="openReader(LR)">📖 Ouvrir la partition</button><p class="m">Touchez la droite de l’écran pour la page suivante, la gauche pour la précédente. Pincez avec deux doigts pour zoomer.</p>`):'<div class="c m">Aucune partition.</div>')+(AU.u?`<button class="big" onclick="playA()">▶ Écouter en lisant la partition</button><p class="m">La musique continue en arrière-plan.</p>`:'<p class="m">Aucun audio.</p>')}
return `<button class="o" onclick="fo=null;draw()">← ${title}</button><h1>${esc(FN[fo]||'Dossier')}</h1>`+(Object.entries(GR).map(([n,fs])=>`<div class="c g"><b>${esc(n)}</b><div class="r">`+(sp=='repertoire'?`<button data-n="${esc(n)}" onclick="it=this.dataset.n;OPENR=1;draw()">Répéter</button>`:fs.map(f=>`<a href="${SU[f.path]}" target="_blank" rel="noopener">Ouvrir</a>`).join(' '))+(ed?`<button class="o" data-n="${esc(n)}" onclick="delFile(this.dataset.n)">Supprimer</button>`:'')+`</div></div>`).join('')||'<div class="c m">Dossier vide.</div>')
+(ed?`<div class="c"><h3>Ajouter ${sp=='repertoire'?'un chant':'un document'}</h3><input id="ft" placeholder="Titre"><p class="m">${sp=='repertoire'?'Partition (PDF ou image)':'Fichier'}</p><input id="fp" type="file">${sp=='repertoire'?'<p class="m">Audio de répétition (MP3)</p><input id="fa" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg,.flac">':''}<p class="err"></p><button class="big" onclick="addFile('${sp}')">Ajouter</button></div>`:'')}
async function addFo(sp){const n=V('nf');if(n){await sb.from('folders').insert({space:sp,name:n});draw()}}
async function addFile(sp){const t=V('ft'),p=$('#fp').files[0],au=$('#fa')&&$('#fa').files[0];if(!t||(!p&&!au))return er('Indiquez un titre et au moins un fichier.');er('Envoi en cours…');
for(const[f,k]of[[p,sp=='repertoire'?'partition':'document'],[au,'audio']]){if(!f)continue;const ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,''),path=`${sp}/${fo}/${Date.now()}-${k}.${ext}`;
const u=await sb.storage.from(BK).upload(path,f,{contentType:f.type||undefined});if(u.error)return er(u.error.message);const r=await sb.from('files').insert({folder_id:fo,name:t,kind:k,path});if(r.error)return er(r.error.message)}draw()}
async function delFile(n){if(!confirm('Supprimer « '+n+' » ?'))return;const fs=GR[n]||[];await sb.storage.from(BK).remove(fs.map(f=>f.path));await sb.from('files').delete().in('id',fs.map(f=>f.id));draw()}
async function pres(){const{data:ev}=await sb.from('events').select('id,starts_at,attendance(user_id,status)').eq('type','repetition').order('starts_at'),{data:ms}=await sb.from('profiles').select('id,name,pupitre').eq('status','valide').neq('role','cheffe').order('name');
const R=(ev||[]).filter(e=>new Date(e.starts_at)<new Date()),t=R.length;
return hd('Présences')+`<button class="o" onclick="${nv('ch')}">← Espace cheffe</button><h2>Bilan par membre</h2><p class="m">${t} répétition(s) passée(s)</p>`+(t?(ms||[]).map(m=>{const s=e=>((e.attendance||[]).find(x=>x.user_id==m.id)||{}).status,o=R.filter(e=>s(e)=='present').length,n=R.filter(e=>s(e)=='absent').length,p=Math.round(o*100/t);return `<div class="c"><div class="r"><b style="flex:1">${esc(m.name)} <span class="m">${esc(m.pupitre)}</span></b><b>${p} %</b></div><div class="bar"><i style="width:${p}%"></i></div><p class="m">${o} présent(e) · ${n} absent(e) · ${t-o-n} sans réponse</p></div>`}).join(''):'<div class="c m">Le bilan apparaîtra après la première répétition passée.</div>')}
function playA(){const p=$('#pl');if(!AU.u)return;p.src=AU.u;p.play();$('#mt').textContent='♫ '+AU.t;$('#mp').hidden=false;try{navigator.mediaSession.metadata=new MediaMetadata({title:AU.t,artist:'Melodiam Meam'})}catch(e){}}
const tg=()=>{const p=$('#pl');p.paused?p.play():p.pause()};
function stopA(){const p=$('#pl');p.pause();p.removeAttribute('src');$('#mp').hidden=true}
let PDF=null,PG=1,LR=null,OPENR=0,RD=null,busy=0,again=0;
async function openReader(r){if(!r)return;LR=r;PG=1;PDF=null;$('#rd').hidden=false;document.body.style.overflow='hidden';$('#rt').textContent=r.t;$('#rn').textContent='';const c=$('#rc');c.innerHTML='<p class="m" style="padding:30px">Chargement…</p>';
if(!r.pdf){c.innerHTML=`<img src="${r.u}" style="max-width:100%;max-height:100%;object-fit:contain" alt="Partition">`;return}
try{if(!window.pdfjsLib)throw 0;pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const b=await(await fetch(r.u)).arrayBuffer();PDF=await pdfjsLib.getDocument({data:b}).promise;c.innerHTML='<canvas id="cv"></canvas>';showPg()}catch(e){c.innerHTML='<p class="m" style="padding:30px">Impossible d’afficher cette partition.</p>'}}
async function showPg(){if(busy){again=1;return}busy=1;try{do{again=0;const p=await PDF.getPage(PG),v=p.getViewport({scale:1}),c=$('#rc'),s=Math.min(c.clientWidth/v.width,c.clientHeight/v.height),d=Math.min(window.devicePixelRatio||1,3),cv=$('#cv'),vp=p.getViewport({scale:s*d});cv.width=vp.width;cv.height=vp.height;cv.style.width=v.width*s+'px';cv.style.height=v.height*s+'px';await p.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;$('#rn').textContent=PG+' / '+PDF.numPages}while(again)}finally{busy=0}}
function tap(e){if(!PDF)return;const r=$('#rc').getBoundingClientRect(),right=e.clientX>r.left+r.width/2;if(right&&PG<PDF.numPages)PG++;else if(!right&&PG>1)PG--;else return;showPg()}
function closeR(){$('#rd').hidden=true;document.body.style.overflow=''}
function rdPlay(){if(!AU.u)return;$('#mt').textContent=='♫ '+AU.t&&$('#pl').getAttribute('src')?tg():playA()}
addEventListener('resize',()=>{if(PDF&&!$('#rd').hidden)showPg()});
const VK='BKEQ81cPFhct5Yfv3KVUN9A3gq1ZndwP94D19Dnq3BE3bwJlGZ7ARMQY9AhCTQz4rFVV2JUTrTw12T9tT1EZggI';
const u8=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(s.length/4)*4,'=')),c=>c.charCodeAt(0));
async function pushOn(){const m=$('#pm');try{if(!('PushManager' in window)||!('Notification' in window))throw new Error('Installez d’abord l’application sur l’écran d’accueil, puis rouvrez-la depuis l’icône.');
if(await Notification.requestPermission()!='granted')throw new Error('Autorisation refusée. Activez-la dans les réglages du téléphone.');
const reg=await navigator.serviceWorker.ready,s=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VK)}),j=s.toJSON();
const r=await sb.from('push_subs').upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,user_id:me.id});if(r.error)throw r.error;m.textContent='✓ Notifications activées sur cet appareil.'}catch(e){m.textContent=e.message||String(e)}}
function auth(){return `<div class="tabs"><button class="${mode=='in'?'on':''}" onclick="mode='in';draw()">Connexion</button><button class="${mode=='up'?'on':''}" onclick="mode='up';draw()">Inscription</button></div><div class="c">`+(mode=='up'?`<input id="nm" placeholder="Prénom et nom" autocomplete="name"><select id="pu"><option value="">Mon pupitre…</option>${PU.map(p=>`<option>${p}</option>`).join('')}</select>`:'')+`<input id="em" type="email" placeholder="E-mail" autocomplete="email"><input id="pw" type="password" placeholder="Mot de passe (8 caractères minimum)" autocomplete="${mode=='up'?'new-password':'current-password'}"><p class="err"></p><button class="big" onclick="go()">${mode=='up'?'Demander mon inscription':'Se connecter'}</button>`+(mode=='up'?'<p class="m">La cheffe validera chaque inscription.</p>':'')+`</div>`}
async function go(){const em=V('em'),pw=V('pw');let r;
if(mode=='up'){const name=V('nm'),pu=V('pu');if(!name||!pu)return er('Indiquez votre nom et votre pupitre.');r=await sb.auth.signUp({email:em,password:pw,options:{data:{name,pupitre:pu}}})}
else r=await sb.auth.signInWithPassword({email:em,password:pw});
if(r.error)return er(/Invalid login/i.test(r.error.message)?'E-mail ou mot de passe incorrect.':/least 6|least 8|weak/i.test(r.error.message)?'Mot de passe trop court.':r.error.message);
if(mode=='up'&&!r.data.session)return er('Inscription enregistrée. Vérifiez vos e-mails pour confirmer.');
loading=true;draw();boot()}
async function ap(id,x){await sb.from('profiles').update(x=='refuse'?{status:'refuse'}:{status:'valide',role:x}).eq('id',id);draw()}
async function out(){try{const s=await(await navigator.serviceWorker.ready).pushManager.getSubscription();if(s)await sb.from('push_subs').delete().eq('endpoint',s.endpoint)}catch(e){}await sb.auth.signOut();sb.removeAllChannels();stopA();window.lv=0;cur=null;me=null;tab='home';draw()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();

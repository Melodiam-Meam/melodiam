<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#1556b8"><title>Melodiam</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Melodiam">
<style>
:root{--bg:#fdfaf3;--card:#fff;--tx:#0c2147;--mut:#68718c;--blue:#1556b8;--gold:#c59d45;--bd:#e1e5f5;--in:#f6f7fc}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:100px}
main{max-width:640px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 20px}
h1{font-size:2.1rem;line-height:1.1;font-weight:800;letter-spacing:-.025em;margin:6px 0 10px}h2{font-size:1.3rem;margin:22px 0 10px}
.eb{margin:0;font-size:.74rem;font-weight:800;letter-spacing:.22em;color:var(--blue)}.m{color:var(--mut);font-size:.9rem;margin:2px 0}.err{color:#c0443f;min-height:1.4em;margin:4px 0;font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.top img{width:76px;height:76px;border-radius:50%;background:#fff;padding:3px;border:2px solid var(--gold)}
.c{background:var(--card);border:1.5px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:12px}.c.g{border-left:5px solid var(--gold)}
button{font:inherit;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px;font-weight:650}button.o{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}button.ok{background:#1f8f58}.big{width:100%;margin-top:8px}
input,select{font:inherit;width:100%;color:var(--tx);background:var(--in);border:1.5px solid var(--bd);border-radius:14px;padding:11px 13px;margin:4px 0}
.r{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{background:var(--card);color:var(--tx);border:1.5px solid var(--bd)}.tabs button.on{background:var(--blue);color:#fff;border-color:var(--gold)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;border-top:1.5px solid var(--bd);border-radius:26px 26px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px #0c214712}
nav button{flex:1;background:none;color:var(--mut);font-size:.72rem;padding:4px 0;display:flex;flex-direction:column;align-items:center;min-height:54px}nav button b{font-size:1.35rem}nav button.on{color:var(--blue)}
.bd{background:#d93a3a;color:#fff;border-radius:99px;font:700 .68rem/18px sans-serif;min-width:18px;height:18px;padding:0 5px;text-align:center;font-style:normal;margin-left:4px}
</style></head><body><main id="app"></main><nav id="nav"></nav>

const $=s=>document.querySelector(s),V=i=>document.getElementById(i).value.trim(),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PU=['soprano','mezzo-soprano','alto','ténor','baryton','basse'];
let me=null,tab='home',mode='in',timer,loading=false;
const first=()=>(me.name||'').split(' ')[0],er=t=>{$('.err').textContent=t};
const hd=t=>`<div class="top"><div><p class="eb">MELODIAM MEAM</p><h1>${t}</h1></div><img src="${L}" alt="Logo Melodiam Meam"></div>`;
async function boot(){const{data:{session}}=await sb.auth.getSession();loading=false;me=null;
if(session){const{data}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();me=data;loading=!data}
draw();if(loading)setTimeout(boot,1500)}
async function draw(){clearInterval(timer);const a=$('#app'),n=$('#nav');n.innerHTML='';
if(loading){a.innerHTML=hd('Chargement…');return}
if(!me){a.innerHTML=hd('Bienvenue ✨')+auth();return}
if(me.status=='en_attente'){a.innerHTML=hd('Demande envoyée')+`<div class="c g"><p>Merci ${esc(first())} ! Votre demande (pupitre : ${esc(me.pupitre)}) attend la validation de la cheffe. Cette page se met à jour toute seule.</p><button class="o" onclick="out()">Se déconnecter</button></div>`;timer=setInterval(boot,10000);return}
if(me.status=='refuse'){a.innerHTML=hd('Accès refusé')+`<div class="c"><p>Votre demande n’a pas été acceptée. Contactez la cheffe pour plus d’informations.</p><button class="o" onclick="out()">Se déconnecter</button></div>`;return}
let np=0;if(me.role=='cheffe'){const r=await sb.from('profiles').select('id',{count:'exact',head:true}).eq('status','en_attente');np=r.count||0}
const bg=np?`<em class="bd">${np}</em>`:'';
n.innerHTML=`<button class="${tab=='home'?'on':''}" onclick="tab='home';draw()"><b>⌂</b>Accueil</button>`+(me.role=='cheffe'?`<button class="${tab=='dem'?'on':''}" onclick="tab='dem';draw()"><b>✓</b>Demandes${bg}</button>`:'')+`<button class="${tab=='me'?'on':''}" onclick="tab='me';draw()"><b>☺</b>Profil</button>`;
if(tab=='dem'&&me.role=='cheffe'){const{data}=await sb.from('profiles').select('*').eq('status','en_attente').order('created_at');
a.innerHTML=hd('Demandes')+(data&&data.length?data.map(u=>`<div class="c g"><b>${esc(u.name)}</b><p class="m">Pupitre : ${esc(u.pupitre)}</p><div class="r"><button class="ok" onclick="ap('${u.id}','membre')">Valider</button><button onclick="ap('${u.id}','bureau')">Valider (bureau)</button><button class="o" onclick="ap('${u.id}','refuse')">Refuser</button></div></div>`).join(''):'<div class="c m">Aucune demande en attente.</div>');return}
if(tab=='me'){a.innerHTML=hd('Profil')+`<div class="c g"><b>${esc(me.name)}</b><p class="m">${me.role=='cheffe'?'Cheffe de chœur':esc(me.pupitre)+(me.role=='bureau'?' · bureau':'')}</p><button class="o" onclick="out()">Se déconnecter</button></div>`;return}
a.innerHTML=hd(`Bonjour ${esc(first())} ✨`)+`<p class="m">Plus qu’un chœur, une voix commune.</p><div class="c g"><h2 style="margin-top:0">Bienvenue dans Melodiam</h2><p>Votre compte est validé. L’agenda, les messages et le répertoire arrivent aux prochaines étapes.</p></div>`}
function auth(){return `<div class="tabs"><button class="${mode=='in'?'on':''}" onclick="mode='in';draw()">Connexion</button><button class="${mode=='up'?'on':''}" onclick="mode='up';draw()">Inscription</button></div><div class="c">`+(mode=='up'?`<input id="nm" placeholder="Prénom et nom" autocomplete="name"><select id="pu"><option value="">Mon pupitre…</option>${PU.map(p=>`<option>${p}</option>`).join('')}</select>`:'')+`<input id="em" type="email" placeholder="E-mail" autocomplete="email"><input id="pw" type="password" placeholder="Mot de passe (8 caractères minimum)" autocomplete="${mode=='up'?'new-password':'current-password'}"><p class="err"></p><button class="big" onclick="go()">${mode=='up'?'Demander mon inscription':'Se connecter'}</button>`+(mode=='up'?'<p class="m">La cheffe validera chaque inscription.</p>':'')+`</div>`}
async function go(){const em=V('em'),pw=V('pw');let r;
if(mode=='up'){const name=V('nm'),pu=V('pu');if(!name||!pu)return er('Indiquez votre nom et votre pupitre.');r=await sb.auth.signUp({email:em,password:pw,options:{data:{name,pupitre:pu}}})}
else r=await sb.auth.signInWithPassword({email:em,password:pw});
if(r.error)return er(/Invalid login/i.test(r.error.message)?'E-mail ou mot de passe incorrect.':/least 6|least 8|weak/i.test(r.error.message)?'Mot de passe trop court.':r.error.message);
if(mode=='up'&&!r.data.session)return er('Inscription enregistrée. Vérifiez vos e-mails pour confirmer.');
loading=true;draw();boot()}
async function ap(id,x){await sb.from('profiles').update(x=='refuse'?{status:'refuse'}:{status:'valide',role:x}).eq('id',id);draw()}
async function out(){await sb.auth.signOut();me=null;tab='home';draw()}
boot();
</script></body></html>
